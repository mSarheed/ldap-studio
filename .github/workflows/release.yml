name: Release
run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name)
  || format('Release {0} ({1}){2}', inputs.version, inputs.channel, inputs.dry_run && ', dry run' || '') }}

# Either push a tag:
#   git tag v1.4.0-beta.1 && git push origin v1.4.0-beta.1   # beta (pre-release)
#   git tag v1.4.0 && git push origin v1.4.0                 # stable
# or run this workflow from main with a version and channel; a beta then gets
# the next free -beta.N, and the tag is created when the release is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.4.0
        required: true
        type: string
      channel:
        description: Channel
        required: true
        type: choice
        options: [beta, stable]
        default: beta
      dry_run:
        description: Build, sign and notarize, but don't publish
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # Settles which release this is, in seconds, before the long build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes_start: ${{ steps.version.outputs.notes_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the release
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$EVENT" = push ]; then
            scripts/release-version.py --tag "$TAG" | tee -a "$GITHUB_OUTPUT"
          else
            scripts/release-version.py --version "$VERSION" --channel "$CHANNEL" | tee -a "$GITHUB_OUTPUT"
          fi
      # Only what has landed on main is released, whichever way the run started.
      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; releases are made from main"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90
    # Holds the signing and notarization secrets; see README § Releasing.
    environment: release
    permissions:
      contents: read
    outputs:
      enclosure: ${{ steps.sparkle.outputs.enclosure }}
      minimum_system: ${{ steps.sparkle.outputs.minimum_system }}
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew bundle --file=Brewfile
      - name: Archive, sign, notarize and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: scripts/release-build.sh
      # The app's updater only installs a zip signed with this key; the
      # signature goes into the appcast item when the release is published.
      - name: Sign the update for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP: dist/ldap-studio-${{ needs.prepare.outputs.tag }}.zip
        run: |
          # sign_update ships with the Sparkle package the app is built with.
          xcodebuild -resolvePackageDependencies -project ldap-studio.xcodeproj -scheme ldap-studio \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" > /dev/null
          ENCLOSURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin/sign_update" --ed-key-file - "$ZIP")"
          MINIMUM_SYSTEM="$(unzip -p "$ZIP" ldap-studio.app/Contents/Info.plist |
            plutil -extract LSMinimumSystemVersion raw -o - -)"
          echo "enclosure=$ENCLOSURE" >> "$GITHUB_OUTPUT"
          echo "minimum_system=$MINIMUM_SYSTEM" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ldap-studio-${{ needs.prepare.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      NOTES_START: ${{ needs.prepare.outputs.notes_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Again, now: a re-run of this job alone (after a failure here) skips
      # prepare, and a newer release may have gone out since.
      - name: Check the release is still newer than the latest stable one
        run: scripts/release-version.py --tag "$TAG"
      # The binaries were built from GITHUB_SHA, so the tag must name it. A
      # manual run creates the tag here, atomically: the API refuses if
      # someone pushed it meanwhile, and the check below then catches a
      # tag pointing anywhere else.
      - name: Tag the built commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api --silent -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" ||
              echo "Tag $TAG already exists; checking where it points"
          fi
          # The commit the tag names, through an annotated tag if need be.
          TAGGED="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha || true)"
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at ${TAGGED:-nothing}, but this run built $GITHUB_SHA"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ldap-studio-${{ needs.prepare.outputs.tag }}
          path: dist
      # Lets anyone check a download was built here: gh attestation verify <file> -R <repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        run: |
          (cd dist && shasum -a 256 -- * > SHA256SUMS.txt)
          if [ "$CHANNEL" = beta ]; then
            INTRO="A beta of the next LDAP Studio. Betas reach you as updates while **LDAP Studio → Check for Beta Versions** is on."
          else
            INTRO="Signed with a Developer ID and notarized by Apple: open the DMG and drag LDAP Studio to Applications."
          fi
          ARGS=(--title "LDAP Studio $VERSION" --notes "$INTRO" --generate-notes --verify-tag)
          if [ -n "$NOTES_START" ]; then ARGS+=(--notes-start-tag "$NOTES_START"); fi
          if [ "$PRERELEASE" = true ]; then ARGS+=(--prerelease --latest=false); else ARGS+=(--latest); fi
          gh release create "$TAG" dist/* "${ARGS[@]}"

  # Installed apps read appcast.xml from main (SUFeedURL), so this is what
  # offers them the update. A job of its own, so that if it fails it can be
  # re-run without publishing the release again.
  appcast:
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BUILD: ${{ github.run_number }}
      ENCLOSURE: ${{ needs.build.outputs.enclosure }}
      MINIMUM_SYSTEM: ${{ needs.build.outputs.minimum_system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contents API refuses the write if main's appcast changed since it
      # was read.
      - name: Add the release to the appcast
        run: |
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          gh api markdown -f mode=gfm -f context="$GH_REPO" -F text=@"$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.html"
          gh api "repos/$GH_REPO/contents/appcast.xml?ref=main" > "$RUNNER_TEMP/current.json"
          jq -r .content "$RUNNER_TEMP/current.json" | base64 --decode > "$RUNNER_TEMP/appcast.xml"
          scripts/release-appcast.py "$RUNNER_TEMP/appcast.xml" --repo "$GH_REPO" --tag "$TAG" \
            --build "$BUILD" --enclosure "$ENCLOSURE" --minimum-system "$MINIMUM_SYSTEM" \
            --notes "$RUNNER_TEMP/notes.html"
          base64 --wrap=0 "$RUNNER_TEMP/appcast.xml" > "$RUNNER_TEMP/appcast.b64"
          gh api --silent -X PUT "repos/$GH_REPO/contents/appcast.xml" \
            -f message="🔖 Add $TAG to the appcast" -f branch=main \
            -f sha="$(jq -r .sha "$RUNNER_TEMP/current.json")" -F content=@"$RUNNER_TEMP/appcast.b64"
