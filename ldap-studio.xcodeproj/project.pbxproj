			shellPath = /bin/sh;
			shellScript = "set -e\nexport PATH=\"$PATH:/usr/bin:/opt/homebrew/bin:/usr/local/bin\"\n# Builds the bundled libraries (core/build/deps, from source, for every\n# architecture) and then core/build/libldapstudio.a. The Makefile picks\n# up ARCHS, MACOSX_DEPLOYMENT_TARGET and SDKROOT from Xcode's environment.\nmake -C \"${SRCROOT}/core\"\n";
